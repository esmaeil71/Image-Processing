# MedImage Studio — local stack (Phase 1)
# See README.md for architecture and run instructions.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medimage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimage_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-medimage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medimage} -d ${POSTGRES_DB:-medimage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port publish — avoids conflict with a local redis on :6379.
    # Backend/worker reach Redis at hostname `redis:6379` on the compose network.

  orthanc:
    # Use a current tag that exists on Docker Hub (avoid stale/invalid tags).
    image: jodogne/orthanc-plugins:1.13.0
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./infra/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    ports:
      - "8042:8042"
    environment:
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "true"
      WEB_VIEWER_PLUGIN_ENABLED: "true"
      DICOM_WEB_PLUGIN_ENABLED: "true"

  # MinIO upstream stopped publishing minio/minio on Docker Hub for anonymous pulls.
  # Chainguard builds from source — public pull without Hub login.
  # See: https://edu.chainguard.dev/chainguard/chainguard-images/getting-started/minio/
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-miniokey}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_SECRET:-miniosecret_dev_change_me}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # Chainguard MinIO is distroless (no curl); `mc` probes the instance
      test:
        [
          "CMD-SHELL",
          'mc alias set probe http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; mc ready probe',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  minio-init:
    # Avoid minio/mc on Docker Hub — use AWS CLI against S3-compatible API
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      aws configure set default.s3.signature_version s3v4 &&
      aws configure set default.s3.addressing_style path &&
      aws --endpoint-url http://minio:9000 s3 mb s3://$${S3_BUCKET:-medimage-storage} 2>/dev/null || true &&
      exit 0
      "
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-miniokey}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_SECRET:-miniosecret_dev_change_me}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-medimage-storage}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - storage_data:/data/storage
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medimage}:${POSTGRES_PASSWORD:-medimage_dev_change_me}@postgres:5432/${POSTGRES_DB:-medimage}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_change_me_use_long_random_in_prod}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc_dev_change_me}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-miniokey}
      S3_SECRET_KEY: ${MINIO_ROOT_SECRET:-miniosecret_dev_change_me}
      S3_BUCKET: ${S3_BUCKET:-medimage-storage}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medimage.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
      # If true, updates admin password on each backend start when ADMIN_EMAIL exists (dev convenience).
      ADMIN_SYNC_PASSWORD: ${ADMIN_SYNC_PASSWORD:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orthanc:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      # If host :8000 is busy, set BACKEND_HOST_PORT in .env (e.g. 18000)
      - "${BACKEND_HOST_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - storage_data:/data/storage
      - ./worker:/app
      - model_weights:/data/models
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medimage}:${POSTGRES_PASSWORD:-medimage_dev_change_me}@postgres:5432/${POSTGRES_DB:-medimage}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-miniokey}
      S3_SECRET_KEY: ${MINIO_ROOT_SECRET:-miniosecret_dev_change_me}
      S3_BUCKET: ${S3_BUCKET:-medimage-storage}
      MODEL_WEIGHTS_DIR: /data/models
      MONAI_BUNDLE_PATH: ${MONAI_BUNDLE_PATH:-}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Dev UI uses Vite proxy; leave empty unless you build static assets with a fixed API URL.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ORTHANC_DICOMWEB: ${VITE_ORTHANC_DICOMWEB:-http://localhost:8042/dicom-web}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Empty VITE_API_URL → browser calls /api/* on :5173, proxied to backend:8000
      VITE_API_URL: ${VITE_API_URL:-}
      API_PROXY_TARGET: http://backend:8000
      VITE_ORTHANC_DICOMWEB: ${VITE_ORTHANC_DICOMWEB:-http://localhost:8042/dicom-web}
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  orthanc_data:
  minio_data:
  storage_data:
  model_weights:
